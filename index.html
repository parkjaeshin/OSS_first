<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tetris</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101318;
      --panel: #1b2028;
      --panel-2: #242b35;
      --text: #f4f7fb;
      --muted: #a9b4c3;
      --accent: #39c6a3;
      --line: #343d49;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(57, 198, 163, 0.16), transparent 28rem),
        linear-gradient(135deg, #101318 0%, #171b22 48%, #11151c 100%);
      color: var(--text);
    }






    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 14px clamp(16px, 4vw, 44px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(16, 19, 24, 0.76);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .login-button {
      min-width: 86px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 7px;
      background: var(--accent);
      color: #07120f;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    main {
      width: min(1050px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 38px);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(220px, 1fr);
      gap: clamp(18px, 4vw, 34px);
      align-items: start;
    }

    .board-wrap {
      display: grid;
      place-items: center;
    }

    canvas {
      width: min(360px, 86vw);
      aspect-ratio: 1 / 2;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #0b0e13;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
    }

    .side {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      background: rgba(27, 32, 40, 0.9);
      padding: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      min-height: 72px;
      padding: 12px;
      border-radius: 7px;
      background: var(--panel-2);
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      font-weight: 800;
    }

    .next-box {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 16px;
      align-items: center;
    }

    #next {
      width: 112px;
      height: 112px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #0b0e13;
    }

    .status {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .actions,
    .touch-controls {
      display: grid;
      gap: 10px;
    }

    .actions {
      grid-template-columns: 1fr 1fr;
    }

    button {
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .primary {
      background: var(--accent);
      color: #07120f;
    }

    .touch-controls {
      grid-template-columns: repeat(5, 1fr);
    }

    .keys {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .game-over {
      color: var(--danger);
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .game-layout {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .next-box {
        grid-template-columns: 96px 1fr;
      }

      #next {
        width: 96px;
        height: 96px;
      }

      .touch-controls button {
        min-width: 0;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tetris</h1>
    <button class="login-button" type="button" aria-label="로그인">로그인</button>
  </header>

  <main>
    <section class="game-layout" aria-label="테트리스 게임">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
      </div>

      <aside class="side">
        <div class="panel stats">
          <div class="stat">
            <span class="label">Score</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="stat">
            <span class="label">Lines</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="stat">
            <span class="label">Level</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="panel next-box">
          <canvas id="next" width="112" height="112"></canvas>
          <p class="status" id="message">블록을 쌓고 가로줄을 지우세요.</p>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="start">시작</button>
          <button type="button" id="pause">일시정지</button>
        </div>

        <div class="touch-controls" aria-label="모바일 조작">
          <button type="button" data-move="left" aria-label="왼쪽">←</button>
          <button type="button" data-move="rotate" aria-label="회전">↻</button>
          <button type="button" data-move="right" aria-label="오른쪽">→</button>
          <button type="button" data-move="down" aria-label="아래">↓</button>
          <button type="button" data-move="drop" aria-label="내리기">⤓</button>
        </div>

        <div class="panel">
          <p class="keys">키보드: ← → 이동, ↑ 회전, ↓ 빠르게 내리기, Space 즉시 내리기, P 일시정지</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;
    const COLORS = {
      I: '#59d2ff',
      J: '#5a7dff',
      L: '#ffa447',
      O: '#f7d84b',
      S: '#55d66b',
      T: '#b76cff',
      Z: '#ff6678'
    };
    const SHAPES = {
      I: [[1, 1, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]],
      O: [[1, 1], [1, 1]],
      S: [[0, 1, 1], [1, 1, 0]],
      T: [[0, 1, 0], [1, 1, 1]],
      Z: [[1, 1, 0], [0, 1, 1]]
    };

    let board;
    let piece;
    let nextPiece;
    let score;
    let lines;
    let level;
    let running = false;
    let paused = false;
    let dropCounter = 0;
    let lastTime = 0;
    let animationId;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function randomPiece() {
      const keys = Object.keys(SHAPES);
      const type = keys[Math.floor(Math.random() * keys.length)];
      return {
        type,
        shape: SHAPES[type].map(row => row.slice()),
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
        y: 0
      };
    }

    function resetGame() {
      board = createBoard();
      piece = randomPiece();
      nextPiece = randomPiece();
      score = 0;
      lines = 0;
      level = 1;
      running = true;
      paused = false;
      dropCounter = 0;
      lastTime = 0;
      messageEl.textContent = '게임 진행 중';
      messageEl.classList.remove('game-over');
      updateStats();
      draw();
      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(update);
    }

    function rotate(matrix) {
      return matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
    }

    function collides(testPiece) {
      return testPiece.shape.some((row, y) =>
        row.some((cell, x) => {
          if (!cell) return false;
          const nextX = testPiece.x + x;
          const nextY = testPiece.y + y;
          return nextX < 0 || nextX >= COLS || nextY >= ROWS || (nextY >= 0 && board[nextY][nextX]);
        })
      );
    }

    function mergePiece() {
      piece.shape.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell && piece.y + y >= 0) {
            board[piece.y + y][piece.x + x] = piece.type;
          }
        });
      });
    }

    function clearLines() {
      let cleared = 0;
      board = board.filter(row => {
        if (row.every(Boolean)) {
          cleared += 1;
          return false;
        }
        return true;
      });

      while (board.length < ROWS) {
        board.unshift(Array(COLS).fill(null));
      }

      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] * level;
        level = Math.floor(lines / 10) + 1;
        updateStats();
      }
    }

    function spawnPiece() {
      piece = nextPiece;
      piece.x = Math.floor(COLS / 2) - Math.ceil(piece.shape[0].length / 2);
      piece.y = 0;
      nextPiece = randomPiece();
      if (collides(piece)) {
        running = false;
        messageEl.textContent = '게임 오버';
        messageEl.classList.add('game-over');
      }
    }

    function move(dx, dy) {
      if (!running || paused) return false;
      const testPiece = { ...piece, x: piece.x + dx, y: piece.y + dy };
      if (!collides(testPiece)) {
        piece = testPiece;
        draw();
        return true;
      }
      return false;
    }

    function softDrop() {
      if (!move(0, 1)) {
        mergePiece();
        clearLines();
        spawnPiece();
        draw();
      } else {
        score += 1;
        updateStats();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (!running || paused) return;
      while (move(0, 1)) {
        score += 2;
      }
      mergePiece();
      clearLines();
      spawnPiece();
      updateStats();
      draw();
    }

    function rotatePiece() {
      if (!running || paused) return;
      const rotated = { ...piece, shape: rotate(piece.shape) };
      const kicks = [0, -1, 1, -2, 2];
      for (const offset of kicks) {
        const testPiece = { ...rotated, x: piece.x + offset };
        if (!collides(testPiece)) {
          piece = testPiece;
          draw();
          return;
        }
      }
    }

    function update(time = 0) {
      if (!running) {
        draw();
        return;
      }

      const delta = time - lastTime;
      lastTime = time;

      if (!paused) {
        dropCounter += delta;
        const speed = Math.max(130, 850 - (level - 1) * 70);
        if (dropCounter > speed) {
          softDrop();
        }
      }

      draw();
      animationId = requestAnimationFrame(update);
    }

    function drawCell(context, x, y, color, size = BLOCK) {
      context.fillStyle = color;
      context.fillRect(x * size, y * size, size, size);
      context.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      context.lineWidth = 2;
      context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.055)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x += 1) {
        ctx.beginPath();
        ctx.moveTo(x * BLOCK, 0);
        ctx.lineTo(x * BLOCK, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y += 1) {
        ctx.beginPath();
        ctx.moveTo(0, y * BLOCK);
        ctx.lineTo(canvas.width, y * BLOCK);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      board.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell) drawCell(ctx, x, y, COLORS[cell]);
        });
      });

      if (piece) {
        piece.shape.forEach((row, y) => {
          row.forEach((cell, x) => {
            if (cell) drawCell(ctx, piece.x + x, piece.y + y, COLORS[piece.type]);
          });
        });
      }

      drawNext();
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;

      const size = 24;
      const shape = nextPiece.shape;
      const offsetX = Math.floor((nextCanvas.width / size - shape[0].length) / 2);
      const offsetY = Math.floor((nextCanvas.height / size - shape.length) / 2);

      shape.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (cell) drawCell(nextCtx, offsetX + x, offsetY + y, COLORS[nextPiece.type], size);
        });
      });
    }

    function updateStats() {
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      levelEl.textContent = level;
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      messageEl.textContent = paused ? '일시정지됨' : '게임 진행 중';
      pauseBtn.textContent = paused ? '계속하기' : '일시정지';
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') move(-1, 0);
      if (event.key === 'ArrowRight') move(1, 0);
      if (event.key === 'ArrowDown') softDrop();
      if (event.key === 'ArrowUp') rotatePiece();
      if (event.code === 'Space') {
        event.preventDefault();
        hardDrop();
      }
      if (event.key.toLowerCase() === 'p') togglePause();
    });

    document.querySelectorAll('[data-move]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.move;
        if (action === 'left') move(-1, 0);
        if (action === 'right') move(1, 0);
        if (action === 'down') softDrop();
        if (action === 'rotate') rotatePiece();
        if (action === 'drop') hardDrop();
      });
    });

    startBtn.addEventListener('click', resetGame);
    pauseBtn.addEventListener('click', togglePause);

    board = createBoard();
    piece = randomPiece();
    nextPiece = randomPiece();
    score = 0;
    lines = 0;
    level = 1;
    updateStats();
    draw();
  </script>
</body>
</html>
